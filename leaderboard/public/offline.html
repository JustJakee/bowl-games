<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>You're offline · Bob's Bowl Games</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #07111f; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 400px; }
      h1 { margin: 0 0 12px; color: #ffcb05; }
      p { margin: 0 0 24px; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #ffcb05; color: #07111f; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to load live scores and save your picks.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
